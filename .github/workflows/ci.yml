name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Cross-compile
        run: ./scripts/dist.sh "dev-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: flutter_brand-binaries
          path: dist/*
